services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        VITE_NEON_AUTH_URL: ${NEON_AUTH_BASE_URL:?Set NEON_AUTH_BASE_URL in .env}
    restart: unless-stopped
    ports:
      - "${PONDOK_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: api
    env_file:
      - .env
    profiles: ["migration"]
    command: ["pnpm", "db:migrate"]
