name: PONDOK OS GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/command-center/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Neon Functions invocation URL for the development API (no trailing slash)
        required: true
        type: string
      neon_auth_url:
        description: Neon Auth base URL for the same development branch
        required: true
        default: https://ep-billowing-boat-b3junw8u.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build operational workspace
        run: pnpm --filter @pondok-os/web build
        env:
          VITE_BASE_PATH: /PONDOK-OS/
          VITE_API_URL: ${{ inputs.api_base_url || 'https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech' }}
          VITE_NEON_AUTH_URL: ${{ inputs.neon_auth_url || 'https://ep-billowing-boat-b3junw8u.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth' }}
          VITE_SUPPORT_WHATSAPP_NUMBER: ${{ vars.PONDOK_SUPPORT_WHATSAPP_NUMBER }}
      - name: Build separate Super Admin Command Center
        run: pnpm --filter @pondok-os/command-center build
        env:
          VITE_BASE_PATH: /PONDOK-OS/command-center/
          VITE_API_URL: ${{ inputs.api_base_url || 'https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech' }}
          VITE_NEON_AUTH_URL: ${{ inputs.neon_auth_url || 'https://ep-billowing-boat-b3junw8u.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth' }}
      - name: Assemble isolated Command Center route
        run: mkdir -p apps/web/dist/command-center && cp -a apps/command-center/dist/. apps/web/dist/command-center/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4