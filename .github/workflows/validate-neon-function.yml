name: Validate PONDOK OS Neon Function bundle

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/validate-neon-function.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/validate-neon-function.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Neon Function bundle
        run: pnpm --filter @pondok-os/api bundle:function
      - name: Smoke-test bundled module
        run: node apps/api/scripts/smoke-test-neon-bundle.mjs
