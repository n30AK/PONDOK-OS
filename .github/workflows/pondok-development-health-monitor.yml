name: PONDOK OS Development Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: pondok-development-health-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Check Neon Development API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API liveness
        id: live
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech/health/live")"
          echo "$response"
          echo "response=$response" >> "$GITHUB_OUTPUT"

      - name: Check API readiness
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech/health/ready")"
          echo "$response"
          echo "response=$response" >> "$GITHUB_OUTPUT"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="ready" || Object.values(x.dependencies??{}).some(v=>v!=="ok")) process.exit(1)' "$response"

      - name: Record successful check
        if: success()
        run: |
          {
            echo "## Development API health"
            echo "- Liveness: passed"
            echo "- Readiness: passed"
            echo "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] PONDOK OS Development API health check failed";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            const body = [
              "Automated health monitor detected a failure in the Neon Development API.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Branch: ${context.ref}`,
              `- Detected: ${new Date().toISOString()}`,
              "",
              "This monitor is read-only. It does not restart services, change data, deploy, or access Neon Production.",
              "Inspect the workflow logs and follow the incident runbook before remediation."
            ].join("\n");
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
