name: Deploy PONDOK OS API to Neon Development

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-neon-function.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_DEV_API to deploy only to the PONDOK OS development branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pondok-neon-development-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirmation == 'DEPLOY_DEV_API'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Neon Functions bundle
        run: pnpm --filter @pondok-os/api bundle:function
      - name: Smoke-test bundled Neon Function module
        run: node apps/api/scripts/smoke-test-neon-bundle.mjs
      - name: Deploy to development branch
        run: pnpm --filter @pondok-os/api deploy:function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - name: Verify deployed API liveness
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 "https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech/health/live"
      - name: Verify deployed API readiness
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 "https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech/health/ready"
      - name: Verify legacy tenant bootstrap is disabled
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --request POST "https://br-proud-paper-b312lfxi-pondokapi.compute.c-4.ap-southeast-1.aws.neon.tech/v1/bootstrap/organization" --header "content-type: application/json" --data '{}')"
          test "$status" = "410"
