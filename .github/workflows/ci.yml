name: PONDOK OS CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "ops/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pondok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pondok_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate migration conventions
        run: pnpm db:check
      - name: Apply all migrations to disposable PostgreSQL
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify accounting, inventory and payroll invariants
        run: node apps/api/scripts/test-ledger-invariants.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify tenant row-level security
        run: node apps/api/scripts/test-tenant-rls.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify authenticated tenant API isolation with signed identities
        run: node apps/api/scripts/test-tenant-api-isolation.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify Module Registry security and audit invariants
        run: node apps/api/scripts/test-module-registry.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify Central Command platform ERP and fleet security
        run: node apps/api/scripts/test-platform-control-plane.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify platform customer-to-tenant link integrity
        run: node apps/api/scripts/test-customer-tenant-link.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify contract subscription integrity
        run: node apps/api/scripts/test-contract-subscriptions.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify recurring invoice period integrity
        run: node apps/api/scripts/test-recurring-invoice-periods.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify client observability, backup and maintenance controls
        run: node apps/api/scripts/test-observability-backup-maintenance.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify module billing, warranty and client repair records
        run: node apps/api/scripts/test-module-billing-warranty-repair.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify Central Command double-entry accounting ledger
        run: node apps/api/scripts/test-central-command-ledger.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Verify procurement and inventory foundation
        run: node apps/api/scripts/test-procurement-inventory-foundation.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build all deployable workspaces
        run: pnpm build
      - name: Verify GitHub Pages base-path build
        run: pnpm --filter @pondok-os/web build
        env:
          VITE_BASE_PATH: /PONDOK-OS/
          VITE_API_URL: https://pondok-api.invalid
          VITE_NEON_AUTH_URL: https://pondok-auth.invalid
      - name: Verify GitHub Pages asset paths
        run: |
          grep -q '/PONDOK-OS/assets/' apps/web/dist/index.html
          grep -q '/PONDOK-OS/manifest.webmanifest' apps/web/dist/index.html
          grep -Fq '"start_url": "./"' apps/web/dist/manifest.webmanifest
      - name: Bundle Neon Functions API
        run: pnpm --filter @pondok-os/api bundle:function
      - name: Upload Neon Functions API bundle
        uses: actions/upload-artifact@v4
        with:
          name: pondok-os-api-neon-function
          path: apps/api/dist/pondok-api-function.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build API container image
        run: docker build --target api -t pondok-os-api:ci .
      - name: Build web container image
        run: docker build --target web --build-arg VITE_NEON_AUTH_URL=https://auth.invalid/neondb/auth -t pondok-os-web:ci .
      - name: Validate Docker Compose configuration
        run: |
          cp .env.compose.example .env
          docker compose config --quiet
          rm .env
      - name: Smoke-test API and Nginx web container runtime
        run: |
          set -euo pipefail
          docker network create pondok-smoke
          cleanup() {
            docker rm -f pondok-web-smoke pondok-api-smoke >/dev/null 2>&1 || true
            docker network rm pondok-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name pondok-api-smoke --network pondok-smoke --network-alias api pondok-os-api:ci
          docker run -d --name pondok-web-smoke --network pondok-smoke -p 8080:80 pondok-os-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null && curl -fsS http://127.0.0.1:8080/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/health/live >/dev/null
          nginx_config_status=$(docker exec pondok-web-smoke nginx -t 2>&1)
          printf '%s\\n' "$nginx_config_status"
      - name: Check live Neon Auth acceptance script syntax
        run: node --check apps/api/scripts/test-live-tenant-auth-isolation.mjs
      - name: Run unit tests
        run: pnpm test
