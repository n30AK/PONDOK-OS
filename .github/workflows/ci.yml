name: PONDOK OS CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pondok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pondok_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate migration conventions
        run: pnpm db:check
      - name: Apply all migrations to disposable PostgreSQL
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondok_test
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build all deployable workspaces
        run: pnpm build
      - name: Run unit tests
        run: pnpm test
